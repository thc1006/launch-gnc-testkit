[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "launch-gnc-testkit"
version = "0.1.0"
description = "Simulator-independent trace validation, provenance, and regression tooling for launch-vehicle GNC experiments"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE", "NOTICE.md"]
authors = [
  { name = "Launch GNC Testkit contributors" },
]
keywords = ["aerospace", "GNC", "simulation", "validation", "reproducibility", "benchmark"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Science/Research",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Scientific/Engineering",
]
dependencies = [
  "jsonschema>=4.23",
  "numpy>=1.26",
  "PyYAML>=6.0",
]

[project.optional-dependencies]
parquet = ["pyarrow>=17"]
dev = [
  "pytest>=8",
  "pytest-cov>=5",
  "ruff==0.15.20",
]

[project.scripts]
gnctest = "launch_gnc_testkit.cli:main"


[tool.setuptools]
package-dir = {"" = "src"}
include-package-data = true

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
launch_gnc_testkit = ["schemas/*.json"]

[tool.pytest.ini_options]
addopts = "-ra --strict-markers"
testpaths = ["tests"]

[tool.ruff]
required-version = "==0.15.20"
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]
